[project]
name = "drums2midi"
version = "0.1.0"
description = "Extract a simplified drum MIDI track (plus a Reaper project) from an audio file or YouTube link."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "torch>=2.11",
  "torchaudio>=2.11",      # required by beat-this; last release is 2.11, see [tool.uv] below
  "demucs==4.1.0",         # drum stem separation
  "adtof-pytorch",         # drum transcription (git, pinned below)
  "beat-this>=1.1.0",      # beat + downbeat tracking
  "librosa>=0.10",
  "soundfile>=0.12",
  "numpy>=1.26",
  "mido>=1.3",
  "typer>=0.12",
  "rich>=13",
]

[project.scripts]
drums2midi = "drums2midi.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.uv]
# demucs pins torch<2.3 and numpy<2 on Intel macOS only; without this, uv's universal lock
# picks those old versions for every platform. Apple Silicon and Linux are all we target.
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux'",
]

[tool.uv.sources]
adtof-pytorch = { git = "https://github.com/xavriley/ADTOF-pytorch", rev = "85c192e78f716ea0b111cc8a5ee4a8f6a3a4f8a9" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drums2midi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs model weights and/or network"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
