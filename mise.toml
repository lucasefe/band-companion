[tools]
node = "22"
python = "3.12"          # torch/demucs stack is safest on 3.12
uv = "latest"
ffmpeg = "9"             # conda-forge prebuilt binary, no Homebrew needed
yt-dlp = "latest"        # standalone binary; `mise upgrade yt-dlp` when YouTube breaks it

[env]
UV_PYTHON_DOWNLOADS = "never"                       # uv must use mise's Python
UV_PROJECT = "{{ config_root }}/tools/backline"     # `uv run`/`uv sync` target the CLI project from anywhere
_.python.venv = { path = "tools/backline/.venv" }   # `backline` on PATH after `cd`

[hooks]
postinstall = "npm ci && uv sync"                   # `mise install` sets up both halves

[tasks.sync]
description = "Install/update JS and Python deps"
run = "npm ci && uv sync"

# --- app -------------------------------------------------------------------
[tasks.dev]
description = "Vite dev server (run `mise run dev:worker` alongside)"
run = "npm run dev"

[tasks."dev:worker"]
run = "npm run dev:worker"

[tasks.typecheck]
run = "npm run typecheck"

[tasks.build]
run = "npm run build"

[tasks.preview]
run = "npm run preview"

[tasks.export]
description = "Every song's .lrc from its Reaper project's markers; newest render wins"
run = "uv run backline export"

[tasks."sync-audio"]
depends = ["export"]
description = "Hash tracks/**/*.wav, upload missing ones to R2, rewrite tracks/audio.json"
run = "npm run sync-audio"

[tasks.deploy]
description = "export + sync-audio + build + wrangler deploy"
depends = ["export"]
run = "npm run deploy"

[tasks."check:browser"]
description = "Headless Chrome run-through against a running worker"
run = "node scripts/browser-check.mjs"

# --- CLI -------------------------------------------------------------------
[tasks.test]
description = "Fast Python tests (~1 s)"
run = "uv run pytest tools/backline/tests"

[tasks."test:slow"]
description = "All Python tests, including Demucs/Beat This! end to end"
run = "uv run pytest tools/backline/tests -m ''"

[tasks.lint]
run = "uv run ruff check tools/backline && uv run ruff format --check tools/backline"

[tasks.fmt]
run = "uv run ruff format tools/backline && uv run ruff check --fix tools/backline"
